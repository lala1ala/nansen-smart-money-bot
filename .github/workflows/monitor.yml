name: Smart Money Monitor Bot

on:
  workflow_dispatch:  # 允许手动触发
  schedule:
    # 每6小时运行一次，对应北京时间 0:00 / 6:00 / 12:00 / 18:00
    # 北京时间 UTC+8，所以 UTC 对应: 16:00 / 22:00 / 4:00 / 10:00
    - cron: '0 16,22,4,10 * * *'

jobs:
  run-bot-once:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system fonts
      run: |
        sudo apt-get install -y fonts-dejavu-core fonts-liberation

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Send report based on current time
      env:
        NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python send_report.py
