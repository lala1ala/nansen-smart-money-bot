name: Daily Data Analyzer

on:
  schedule:
    # 每天北京时间 10:00 运行 (UTC 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发执行

jobs:
  analyze_and_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests python-dotenv; fi

      - name: Run Analyzer
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          python analyzer.py

      - name: Commit and push database changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data_history.db
          # 如果数据库有更新，就提交并推送
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update database [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
